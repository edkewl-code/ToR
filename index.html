<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The One Ring 2e - Player-Hero Sheet & Campaign Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-parchment: #FDFBF7;
      --bg-card: #F4EFE6;
      --bg-card-alt: #EAE1D2;
      --border-crimson: #8B0000;
      --text-main: #2B2B2B;
      --accent-gold: #C5A059;
      --accent-gold-dark: #6A521F;
      --status-weary: #B22222;
      --status-miserable: #4B0082;
      --status-wounded: #8B0000;
      --font-heading: 'Cinzel', serif;
      --font-body: 'EB Garamond', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; }
    body {
      background-color: #222;
      color: var(--text-main);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.4;
      padding: 20px;
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

   .status-box-container {
     flex: 1;
     display: flex;
     flex-direction: column;
     gap: 4px;
    }
    .status-progress-track {
      width: 100%;
      height: 8px;
      background-color: var(--bg-card-alt);
      border: 1px solid var(--accent-gold);
      border-radius: 4px;
      overflow: hidden;
    }
    .status-progress-fill {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    .fill-weary {
      background-color: var(--status-weary); /* Red */
    }
    .fill-miserable {
      background-color: #8A2BE2; /* Lila / Purple */
    }

    .app-container {
      width: 100%;
      max-width: 1100px;
      background: var(--bg-parchment);
      border: 3px double var(--border-crimson);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      padding: 30px;
      position: relative;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      padding: 12px 20px;
      border: 1px solid var(--accent-gold);
      border-radius: 4px;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .top-controls .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .save-indicator {
      font-family: var(--font-heading);
      font-size: 0.75rem;
      font-weight: 700;
      color: #2E7D32;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .save-indicator.show { opacity: 1; }

    .primary-nav-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 3px double var(--border-crimson);
      padding-bottom: 2px;
    }
    .primary-tab-btn {
      flex: 1;
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 12px 16px;
      background: var(--bg-card-alt);
      border: 2px solid var(--accent-gold);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }
    .primary-tab-btn:hover {
      background: var(--bg-card);
      color: var(--border-crimson);
    }
    .primary-tab-btn.active {
      background: var(--border-crimson);
      color: #FFF;
      border-color: var(--border-crimson);
      box-shadow: 0 -2px 8px rgba(139, 0, 0, 0.2);
    }

    .primary-view { display: none; }
    .primary-view.active { display: block; }

    .btn {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 8px 16px;
      border: 1px solid var(--border-crimson);
      background-color: var(--bg-parchment);
      color: var(--border-crimson);
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 2px;
      min-height: 36px;
    }
    .btn:hover { background-color: var(--border-crimson); color: #fff; }
    .btn-gold { border-color: var(--accent-gold-dark); color: var(--accent-gold-dark); }
    .btn-gold:hover { background-color: var(--accent-gold-dark); color: #fff; }
    .btn-danger { border-color: #a00; color: #a00; }
    .btn-danger:hover { background-color: #a00; color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 0.75rem; min-height: 28px; }

    .has-desc {
      cursor: pointer;
      text-decoration: underline dotted var(--accent-gold-dark);
      transition: color 0.2s ease, text-decoration-color 0.2s ease;
    }
    .has-desc:hover {
      color: var(--border-crimson);
      text-decoration-color: var(--border-crimson);
    }
    .info-btn-inline {
      display: inline-block;
      margin-left: 5px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--accent-gold-dark);
      border: 1px solid var(--accent-gold);
      border-radius: 50%;
      width: 18px;
      height: 18px;
      line-height: 16px;
      text-align: center;
      font-weight: bold;
      background: var(--bg-card-alt);
      vertical-align: middle;
    }
    .info-btn-inline:hover {
      background: var(--border-crimson);
      color: #fff;
      border-color: var(--border-crimson);
    }

    .sheet-header {
      border-bottom: 2px solid var(--border-crimson);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .sheet-title {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      color: var(--border-crimson);
      text-align: center;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }
    .header-inputs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }
    .field-box {
      display: flex;
      flex-direction: column;
      /* Allow this grid/flex item to shrink below input's intrinsic min-content */
      min-width: 0;
    }
    .field-box label {
      font-family: var(--font-heading);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-gold-dark);
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .field-box input, .field-box select, .field-box textarea {
      font-family: var(--font-body);
      font-size: 1.05rem;
      font-weight: 600;
      padding: 6px 8px;
      border: 1px solid var(--accent-gold);
      background: var(--bg-card);
      color: var(--text-main);
      /* Prevent browsers' default min-width from forcing layout overflow */
      min-width: 0;
    }
    .field-box.highlight-exp input {
      background: #FFF8DC;
      border-color: var(--border-crimson);
      color: var(--border-crimson);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }
    @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }

    .section-title {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      color: #fff;
      background: var(--border-crimson);
      padding: 6px 12px;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .attributes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .attr-card {
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      padding: 10px;
      text-align: center;
      border-radius: 4px;
    }
    .attr-card .attr-name {
      font-family: var(--font-heading);
      font-size: 0.95rem;
      color: var(--border-crimson);
      font-weight: 700;
    }
    .attr-card .attr-score {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 4px 0;
    }
    .attr-card .attr-tn {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-gold-dark);
    }

    .derived-grid {
      display: grid;
      grid-template-columns: repeat( auto-fit, minmax(125px, 1fr) );
      gap: 10px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      padding: 8px;
      border-radius: 4px;
      text-align: center;
    }
    .stat-card label {
      font-family: var(--font-heading);
      font-size: 0.72rem;
      color: var(--accent-gold-dark);
      display: block;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .counter-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .counter-control input {
      width: 44px;
      height: 32px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      border: 1px solid var(--accent-gold);
      background: #fff;
    }

    .status-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .badge {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      font-family: var(--font-heading);
      font-weight: 700;
      border: 2px solid #ccc;
      color: #777;
      background: #f0f0f0;
      border-radius: 4px;
      transition: all 0.3s;
      cursor: pointer;
      user-select: none;
    }
    .badge.active-weary {
      border-color: var(--status-weary);
      background: #FADBD8;
      color: var(--status-weary);
      animation: pulse 2s infinite;
    }
    .badge.active-miserable {
      border-color: var(--status-miserable);
      background: #E8DAEF;
      color: var(--status-miserable);
      animation: pulse 2s infinite;
    }
    .badge.active-wounded {
      border-color: var(--status-wounded);
      background: #F5C6CB;
      color: var(--status-wounded);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.85; } 50% { opacity: 1; } 100% { opacity: 0.85; } }

    .skills-container { margin-bottom: 20px; }
    .skill-group-header {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      background: var(--bg-card-alt);
      padding: 4px 8px;
      font-weight: 700;
      color: var(--border-crimson);
      border-left: 3px solid var(--border-crimson);
      margin-top: 8px;
    }
    .skill-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-bottom: 1px dashed #DDD;
    }
    .skill-row:hover { background: rgba(0,0,0,0.02); }
    .skill-left { display: flex; align-items: center; gap: 10px; }
    .skill-name { font-weight: 600; font-size: 0.95rem; }
    .skill-attr { font-size: 0.75rem; color: #666; font-style: italic; }

    .fav-star {
      font-size: 1.3rem;
      color: #CCC;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease, transform 0.1s ease;
      line-height: 1;
      padding: 2px 4px;
    }
    .fav-star.active {
      color: var(--accent-gold-dark);
      text-shadow: 0 0 2px var(--accent-gold);
    }
    .fav-star:hover { transform: scale(1.15); }

    .dots { display: flex; gap: 6px; cursor: pointer; padding: 4px 0; }
    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid var(--border-crimson);
      background: transparent;
      transition: background 0.15s ease;
    }
    .dot.filled { background: var(--border-crimson); }

    .roll-btn-inline {
      padding: 2px 6px;
      font-size: 0.72rem;
      font-family: var(--font-heading);
      border: 1px solid var(--accent-gold-dark);
      background: var(--bg-card);
      color: var(--accent-gold-dark);
      cursor: pointer;
      border-radius: 3px;
      margin-left: 4px;
    }
    .roll-btn-inline:hover { background: var(--accent-gold-dark); color: #fff; }

    .tab-bar {
      display: flex;
      gap: 4px;
      border-bottom: 2px solid var(--border-crimson);
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .tab-btn {
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 12px;
      background: var(--bg-card-alt);
      border: 1px solid var(--accent-gold);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      color: var(--text-main);
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--border-crimson);
      color: #fff;
      border-color: var(--border-crimson);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .stance-container {
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .stance-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .stance-btn {
      flex: 1;
      min-width: 100px;
      padding: 8px 4px;
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--bg-card-alt);
      border: 1px solid var(--accent-gold);
      color: var(--text-main);
      cursor: pointer;
      border-radius: 3px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .stance-btn:hover {
      border-color: var(--border-crimson);
      color: var(--border-crimson);
    }
    .stance-btn.active {
      background: var(--border-crimson);
      color: #FFF;
      border-color: var(--border-crimson);
      box-shadow: 0 2px 6px rgba(139, 0, 0, 0.3);
    }
    .stance-info-card {
      background: var(--bg-parchment);
      border: 1px dashed var(--accent-gold);
      padding: 10px 12px;
      border-radius: 3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .stance-info-text {
      font-size: 0.88rem;
      line-height: 1.35;
    }
    .stance-task-badge {
      font-family: var(--font-heading);
      font-size: 0.72rem;
      color: var(--accent-gold-dark);
      font-weight: 700;
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
    }

    .journey-role-card {
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .journey-role-grid {
      display: grid;
      grid-template-columns: repeat( auto-fit, minmax(110px, 1fr) );
      gap: 8px;
      margin-bottom: 12px;
    }
    .role-btn {
      padding: 10px 6px;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--bg-card-alt);
      border: 1px solid var(--accent-gold);
      color: var(--text-main);
      cursor: pointer;
      border-radius: 3px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .role-btn:hover { border-color: var(--border-crimson); color: var(--border-crimson); }
    .role-btn.active {
      background: var(--border-crimson);
      color: #FFF;
      border-color: var(--border-crimson);
    }
    .log-entry-card {
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .journey-heading-banner {
      background: var(--bg-card-alt);
      border: 2px solid var(--border-crimson);
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
      font-size: 0.88rem;
    }
    table.data-table th, table.data-table td {
      border: 1px solid var(--accent-gold);
      padding: 6px 8px;
      text-align: left;
    }
    table.data-table th {
      background: var(--bg-card-alt);
      font-family: var(--font-heading);
      font-size: 0.75rem;
      color: var(--border-crimson);
    }

    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--accent-gold);
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 4px;
    }
    .info-card h4 {
      font-family: var(--font-heading);
      color: var(--border-crimson);
      margin-bottom: 4px;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .rules-tag {
      font-size: 0.75rem;
      color: var(--accent-gold-dark);
      font-style: italic;
      margin-top: 2px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-body {
      background: var(--bg-parchment);
      border: 3px double var(--border-crimson);
      width: 90%;
      max-width: 860px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.5);
    }
    .wizard-step { display: none; }
    .wizard-step.active { display: block; }

    .item-list-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid #E0D5C1;
    }

    .fel-section-box {
      border: 1px solid var(--accent-gold);
      background: var(--bg-card);
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 4px;
    }
    .fel-section-box h4 {
      font-family: var(--font-heading);
      color: var(--border-crimson);
      border-bottom: 1px solid var(--accent-gold);
      padding-bottom: 4px;
      margin-bottom: 8px;
      font-size: 1rem;
    }

    .dice-tray {
      background: #1C1917;
      color: #FDFBF7;
      border: 2px solid var(--accent-gold);
      padding: 15px;
      border-radius: 6px;
      margin-top: 15px;
      text-align: center;
    }
    .dice-results-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    .die-result {
      width: 42px;
      height: 42px;
      line-height: 38px;
      font-family: var(--font-heading);
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 4px;
      border: 2px solid var(--accent-gold);
      background: #2B2B2B;
      color: #FFF;
      display: inline-block;
    }
    .die-result.feat { border-color: var(--border-crimson); background: #4A0808; color: #FFF; }
    .die-result.feat.gandalf { background: var(--accent-gold); color: #000; border-color: #FFF; }
    .die-result.feat.eye { background: #000; color: #FF4444; border-color: #FF4444; }
    .die-result.success-6 { border-color: var(--accent-gold); background: #8C6D2B; color: #FFF; }
    .die-result.weary-zero { opacity: 0.4; text-decoration: line-through; }

    @media print {
      body { background: #fff; padding: 0; }
      .app-container { box-shadow: none; border: none; padding: 0; width: 100%; max-width: none; }
      .top-controls, .primary-nav-bar, .btn, .no-print, .info-btn-inline, .tab-bar, .roll-btn-inline { display: none !important; }
      .primary-view { display: block !important; margin-bottom: 30px; }
      .tab-content { display: block !important; margin-bottom: 20px; }
      .main-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
      .badge.active-weary, .badge.active-miserable, .badge.active-wounded { animation: none; }
      .has-desc { text-decoration: none; color: inherit !important; cursor: default; }
    }

/* ============================================================
   RESPONSIVIDADE — MOBILE FIRST
   As regras abaixo só entram em ação em telas pequenas; acima
   de 768px o layout de desktop permanece exatamente como era.
   Breakpoint principal: 768px (celulares e tablets)
   Breakpoint de refinamento: 480px (celulares menores)
   ============================================================ */
@media (max-width: 768px) {

  /* 1. Contêiner principal e margens externas */
  body {
    padding: 8px;
  }
  .app-container {
    padding: 14px;
    border-width: 2px;
  }

  /* 2. Barra de ferramentas superior */
  .top-controls {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 10px 12px;
  }
  .top-controls > div:first-child {
    justify-content: center;
  }
  .top-controls .btn-group {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    width: 100%;
  }
  .top-controls .btn-group .btn {
    width: 100%;
    text-align: center;
    padding: 8px 4px;
    font-size: 0.72rem;
    min-height: 34px;
  }

  /* 3. Título da ficha + botões de ação (Use Hope / Short Rest / Prolonged Rest) */
  .sheet-header > div:first-of-type {
    flex-direction: column;
  }
  .sheet-header .sheet-title {
    width: 100%;
  }
  .sheet-header .btn-group {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    width: 100%;
  }
  .sheet-header .btn-group .btn {
    width: 100%;
    font-size: 0.72rem;
    padding: 8px 4px;
  }

  /* 4. Navegação primária (Character Sheet / Journey & Campaign) */
  .primary-nav-bar {
    gap: 4px;
  }
  .primary-tab-btn {
    font-size: 0.72rem;
    padding: 10px 4px;
    letter-spacing: 0;
  }

  /* 5. Sub-abas internas (Combat & Gear / Virtues / Features) */
  .tab-bar {
    gap: 4px;
  }
  .tab-btn {
    font-size: 0.72rem;
    padding: 8px 6px;
  }

  /* 6. Título e campos do cabeçalho */
  .sheet-title {
    font-size: 1.4rem;
    letter-spacing: 1px;
  }
  #view-journey .sheet-title {
    font-size: 1.3rem !important;
  }
  .header-inputs {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  /* 7. Barra de status (Weary, Miserable, Wounded) */
  .status-bar {
    flex-direction: column;
    gap: 8px;
  }

  /* 8. Atributos primários e estatísticas derivadas */
  .attributes-grid {
    gap: 6px;
  }
  .attr-card {
    padding: 8px 4px;
  }
  .attr-card .attr-score {
    font-size: 1.4rem;
  }
  .derived-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  /* 9. Lista de Perícias em telas estreitas */
  .skill-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 8px 4px;
  }
  .skill-left {
    width: 100%;
    justify-content: space-between;
  }
  .dots {
    width: 100%;
    justify-content: flex-end;
  }

  /* 10. Postura de combate e papel de jornada */
  .stance-bar {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
  }
  .stance-btn {
    min-width: 0;
  }
  .stance-info-card {
    flex-direction: column;
    align-items: flex-start;
  }
  .journey-role-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  /* 11. Rolagem horizontal segura para tabelas (combate, equipamentos, montarias) */
  .data-table {
    display: block;
    width: 100%;
    overflow-x: auto;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  /* 12. Modals e janelas flutuantes ocupam quase toda a tela */
  .modal-overlay {
    align-items: flex-start;
    padding: 10px 0;
  }
  .modal-body {
    width: 95%;
    padding: 16px 12px;
    max-height: 92vh;
    border-width: 2px;
  }
  .modal-body h2 {
    font-size: 1.2rem;
  }
  .modal-body h3 {
    font-size: 1.05rem;
  }

  /* 13. Grupos de botões genéricos quebram linha em vez de vazar da tela */
  .btn-group {
    flex-wrap: wrap;
  }

  /* 14. Linhas flexíveis "espaço-entre" (cabeçalhos de modal, cards de
     contador, opções de checkbox/rádio) quebram linha quando necessário
     em vez de espremer ou cortar conteúdo */
  [style*="justify-content:space-between"],
  [style*="justify-content: space-between"] {
    flex-wrap: wrap;
    row-gap: 6px;
  }

  /* 15. Grades de colunas fixas definidas inline (formulários dos modais,
     assistente de criação de herói, e listas geradas dinamicamente via
     JavaScript: perícias, combate, equipamento, virtudes/recompensas)
     viram uma única coluna no celular, mantendo tudo legível */
  [style*="grid-template-columns:"] {
    grid-template-columns: 1fr !important;
  }

  /* 16. Bandeja de dados (resultados de rolagem) */
  .die-result {
    width: 36px;
    height: 36px;
    line-height: 32px;
    font-size: 1.05rem;
  }
  .dice-results-container {
    gap: 6px;
  }
}

/* ============================================================
   Refinamento extra para celulares pequenos (≤ 480px)
   ============================================================ */
@media (max-width: 480px) {
  .sheet-title {
    font-size: 1.2rem;
  }
  #view-journey .sheet-title {
    font-size: 1.1rem !important;
  }

  .primary-tab-btn {
    font-size: 0.65rem;
    padding: 8px 2px;
  }
  .tab-btn {
    font-size: 0.68rem;
    padding: 6px 4px;
  }

  .top-controls .btn-group,
  .sheet-header .btn-group {
    grid-template-columns: 1fr 1fr;
  }

  .attr-card .attr-score {
    font-size: 1.2rem;
  }
  .derived-grid {
    grid-template-columns: 1fr 1fr;
  }
  .journey-role-grid {
    grid-template-columns: 1fr 1fr;
  }
  .stance-bar {
    grid-template-columns: 1fr 1fr;
  }

  .die-result {
    width: 32px;
    height: 32px;
    line-height: 28px;
    font-size: 0.92rem;
  }
}
